<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1917" />
      <stop offset="100%" stop-color="#0A0B0E" />
    </linearGradient>
    <linearGradient id="favBolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275" />
      <stop offset="35%" stop-color="#FFA800" />
      <stop offset="100%" stop-color="#FF4000" />
    </linearGradient>
    <linearGradient id="favBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7700" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FF3300" stop-opacity="0.4" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#favBg)" stroke="url(#favBorder)" stroke-width="20" />

  <!-- Center Energy Glow -->
  <circle cx="256" cy="256" r="140" fill="#FF5500" opacity="0.22" filter="url(#favGlow)" />

  <!-- High-Power Lightning Bolt Icon -->
  <path d="M 280,72 L 140,246 L 250,246 L 216,440 L 372,216 L 260,216 Z" fill="url(#favBolt)" filter="url(#favGlow)" />
</svg>