<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>বাংলাদেশে কারেন্ট আছে কি? | লাইভ বিদ্যুৎ স্ট্যাটাস ট্র্যাকার (CurrentAche BD)</title>
    <meta name="description" content="আপনার এলাকায় কারেন্ট আছে কি না জানুন এবং রিয়েল-টাইম আপডেট দিন। সারা বাংলাদেশের বিদ্যুৎ ও লোডশেডিং এর বর্তমান অবস্থা।" />
    <meta property="og:title" content="বাংলাদেশে কারেন্ট আছে কি? | Electricity Status Bangladesh" />
    <meta property="og:description" content="সারা বাংলাদেশের বিদ্যুৎ ও লোডশেডিং এর রিয়েল-টাইম কমিউনিটি স্ট্যাটাস।" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('currentache_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="min-h-screen antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
